events {
    worker_connections 1024;
}

http {
    upstream auth_backend {
        server digitalsponsor-auth-prod.centralus.azurecontainer.io:8080;
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name auth.commonsolution.org;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS proxy to auth service
    server {
        listen 443 ssl http2;
        server_name auth.commonsolution.org;
        
        # Self-signed SSL certificate
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # Handle preflight requests
        location / {
            # Set CORS headers based on origin
            set $cors_origin "";
            if ($http_origin ~* "^https://(digitalsponsor\.commonsolution\.org|agreeable-dune-0593f6a10\.6\.azurestaticapps\.net)$") {
                set $cors_origin $http_origin;
            }
            
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Allow-Credentials "true" always;
            
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Access-Control-Allow-Credentials "true";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 200;
            }
            
            proxy_pass http://auth_backend;
            proxy_set_header Host digitalsponsor-auth-prod.centralus.azurecontainer.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}