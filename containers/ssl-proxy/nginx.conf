events {
    worker_connections 1024;
}

http {
    upstream admin_backend {
        server digitalsponsor-admin-service.centralus.azurecontainer.io:8080;
    }
    
    upstream ads_backend {
        server digitalsponsor-ad-service.centralus.azurecontainer.io:8000;
    }
    
    upstream payments_backend {
        server digitalsponsor-payment-service.centralus.azurecontainer.io:8001;
    }
    
    upstream subscriptions_backend {
        server digitalsponsor-subscription-service.centralus.azurecontainer.io:8002;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name admin.digitalsponsor.commonsolution.org ads.digitalsponsor.commonsolution.org payments.digitalsponsor.commonsolution.org subscriptions.digitalsponsor.commonsolution.org;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS Admin Service
    server {
        listen 443 ssl;
        server_name admin.digitalsponsor.commonsolution.org;
        
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        location / {
            proxy_pass http://admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS Ads Service
    server {
        listen 443 ssl;
        server_name ads.digitalsponsor.commonsolution.org;
        
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        location / {
            proxy_pass http://ads_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS Payments Service
    server {
        listen 443 ssl;
        server_name payments.digitalsponsor.commonsolution.org;
        
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        location / {
            proxy_pass http://payments_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS Subscriptions Service
    server {
        listen 443 ssl;
        server_name subscriptions.digitalsponsor.commonsolution.org;
        
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        location / {
            proxy_pass http://subscriptions_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}