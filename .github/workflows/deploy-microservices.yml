name: Deploy Function Apps Microservices

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
      services:
        description: 'Services to deploy (comma-separated: health,auth,session or "all")'
        required: true
        default: 'all'
        type: string
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'infrastructure/*-service.bicep'
      - '.github/workflows/deploy-microservices.yml'

env:
  NODE_VERSION: '20.x'
  AZURE_RESOURCE_GROUP: 'rg-digitalsponsor-centralus'
  AZURE_LOCATION: 'centralus'

jobs:
  security-review:
    name: Security & Quality Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './functions'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          skip-dirs: 'node_modules'

      - name: Verify no secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./functions
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail

  prepare-deployment:
    name: Prepare Deployment Matrix
    runs-on: ubuntu-latest
    needs: [security-review]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Set deployment matrix
        id: set-matrix
        run: |
          SERVICES="${{ inputs.services || 'all' }}"

          if [ "$SERVICES" = "all" ]; then
            MATRIX='{"service":["health","auth","session"]}'
          else
            # Convert comma-separated string to JSON array
            IFS=',' read -ra SERVICE_ARRAY <<< "$SERVICES"
            SERVICES_JSON=$(printf '%s\n' "${SERVICE_ARRAY[@]}" | jq -R . | jq -s .)
            MATRIX="{\"service\":$SERVICES_JSON}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Deployment matrix: $MATRIX"

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [prepare-deployment]
    timeout-minutes: 20
    strategy:
      matrix: ${{ fromJson(needs.prepare-deployment.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --tags project=digitalsponsor environment=${{ inputs.environment || 'prod' }}

      - name: Deploy ${{ matrix.service }} service infrastructure
        run: |
          SERVICE="${{ matrix.service }}"
          TEMPLATE_FILE="infrastructure/${SERVICE}-service.bicep"
          DEPLOYMENT_NAME="${SERVICE}-service-$(date +%Y%m%d-%H%M%S)"

          echo "🚀 Deploying infrastructure for $SERVICE service..."

          if [ ! -f "$TEMPLATE_FILE" ]; then
            echo "❌ Template file $TEMPLATE_FILE not found"
            exit 1
          fi

          az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file $TEMPLATE_FILE \
            --parameters environment=${{ inputs.environment || 'prod' }} \
            --name $DEPLOYMENT_NAME \
            --verbose

          echo "✅ Infrastructure deployed successfully for $SERVICE service"

  build-and-deploy-functions:
    name: Build & Deploy Functions
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, prepare-deployment]
    timeout-minutes: 20
    strategy:
      matrix: ${{ fromJson(needs.prepare-deployment.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build ${{ matrix.service }} service
        run: |
          SERVICE="${{ matrix.service }}"

          # Map service names to their actual directory names
          case $SERVICE in
            "health")
              SERVICE_DIR="health-service"
              FUNCTION_APP_NAME="health-digitalsponsor-prod"
              ;;
            "auth")
              SERVICE_DIR="auth-service-v2"
              FUNCTION_APP_NAME="auth-v2-digitalsponsor-prod"
              ;;
            "session")
              SERVICE_DIR="session-service"
              FUNCTION_APP_NAME="session-digitalsponsor-prod"
              ;;
            *)
              echo "❌ Unknown service: $SERVICE"
              exit 1
              ;;
          esac

          SERVICE_PATH="functions/$SERVICE_DIR"

          echo "🔨 Building $SERVICE service from $SERVICE_PATH..."

          # Verify service directory exists
          if [ ! -d "$SERVICE_PATH" ]; then
            echo "❌ Service directory $SERVICE_PATH not found"
            exit 1
          fi

          # Install dependencies and build deployment package
          cd $SERVICE_PATH
          npm ci

          # Create deployment package
          zip -r "${SERVICE}-deployment.zip" . -x "*.git*" "*.DS_Store*" "test/*" "*.log"

          PACKAGE_SIZE=$(du -h "${SERVICE}-deployment.zip" | cut -f1)
          echo "📦 Package size: $PACKAGE_SIZE"

          # Deploy to Azure Function App
          echo "🚀 Deploying $SERVICE service to $FUNCTION_APP_NAME..."

          az functionapp deployment source config-zip \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name $FUNCTION_APP_NAME \
            --src "${SERVICE}-deployment.zip"

          echo "✅ $SERVICE service deployed successfully"

          # Store outputs for health checks
          echo "FUNCTION_APP_NAME_$SERVICE=$FUNCTION_APP_NAME" >> $GITHUB_ENV

  health-check:
    name: Health Check & Validation
    runs-on: ubuntu-latest
    needs: [build-and-deploy-functions, prepare-deployment]
    timeout-minutes: 15

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Wait for deployment stabilization
        run: |
          echo "⏳ Waiting for deployments to stabilize..."
          sleep 60

      - name: Health Check - All Deployed Services
        run: |
          SERVICES="${{ inputs.services || 'all' }}"

          if [ "$SERVICES" = "all" ]; then
            SERVICES_ARRAY=("health" "auth" "session")
          else
            IFS=',' read -ra SERVICES_ARRAY <<< "$SERVICES"
          fi

          echo "🏥 Running health checks for services: ${SERVICES_ARRAY[*]}"

          FAILED_SERVICES=()

          for SERVICE in "${SERVICES_ARRAY[@]}"; do
            case $SERVICE in
              "health")
                URL="https://health-digitalsponsor-prod.azurewebsites.net/api/health"
                EXPECTED_PATTERN="healthy"
                ;;
              "auth")
                URL="https://auth-v2-digitalsponsor-prod.azurewebsites.net/api/auth/validate"
                EXPECTED_PATTERN="authenticated"
                ;;
              "session")
                URL="https://session-digitalsponsor-prod.azurewebsites.net/api/session"
                EXPECTED_PATTERN="session-service"
                ;;
              *)
                echo "❌ Unknown service: $SERVICE"
                continue
                ;;
            esac
            
            echo "🔍 Testing $SERVICE service at $URL..."
            
            # Retry logic for health checks
            SUCCESS=false
            for i in {1..10}; do
              echo "  Health check attempt $i/10 for $SERVICE..."
              
              if RESPONSE=$(curl -f -s -w "HTTPSTATUS:%{http_code}" "$URL" 2>/dev/null); then
                HTTP_CODE=$(echo $RESPONSE | tr -d '\n' | sed -E 's/.*HTTPSTATUS:([0-9]{3})$/\1/')
                BODY=$(echo $RESPONSE | sed -E 's/HTTPSTATUS:[0-9]{3}$//')
                
                if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]] && echo "$BODY" | grep -q "$EXPECTED_PATTERN"; then
                  echo "  ✅ $SERVICE service health check passed (HTTP $HTTP_CODE)"
                  
                  # Parse and display response time if available
                  if echo "$BODY" | grep -q "responseTime"; then
                    RESPONSE_TIME=$(echo "$BODY" | jq -r '.responseTime // "N/A"' 2>/dev/null || echo "N/A")
                    echo "  ⏱️  Response time: $RESPONSE_TIME"
                  fi
                  
                  SUCCESS=true
                  break
                else
                  echo "  ⚠️  $SERVICE service responded with HTTP $HTTP_CODE or unexpected content"
                fi
              else
                echo "  ⚠️  $SERVICE service request failed"
              fi
              
              if [ $i -lt 10 ]; then
                sleep 30
              fi
            done
            
            if [ "$SUCCESS" = "false" ]; then
              echo "  ❌ $SERVICE service health check failed after 10 attempts"
              FAILED_SERVICES+=("$SERVICE")
            fi
          done

          if [ ${#FAILED_SERVICES[@]} -gt 0 ]; then
            echo ""
            echo "❌ Health checks failed for: ${FAILED_SERVICES[*]}"
            exit 1
          else
            echo ""
            echo "✅ All service health checks passed!"
          fi

      - name: API Integration Tests
        run: |
          echo "🧪 Running API integration tests..."

          # Test session creation and retrieval flow
          echo "Testing session service workflow..."

          # Create a session
          SESSION_RESPONSE=$(curl -s -X POST \
            "https://session-digitalsponsor-prod.azurewebsites.net/api/session/create" \
            -H "Content-Type: application/json" \
            -d '{"userId":"test-user-123","userData":{"name":"Test User"}}')

          if echo "$SESSION_RESPONSE" | grep -q '"success":true'; then
            SESSION_ID=$(echo "$SESSION_RESPONSE" | jq -r '.session.sessionId')
            echo "✅ Session created successfully: $SESSION_ID"
            
            # Retrieve the session
            GET_RESPONSE=$(curl -s "https://session-digitalsponsor-prod.azurewebsites.net/api/session/get?sessionId=$SESSION_ID")
            
            if echo "$GET_RESPONSE" | grep -q '"success":true'; then
              echo "✅ Session retrieved successfully"
              
              # Clean up - delete the session
              curl -s -X DELETE \
                "https://session-digitalsponsor-prod.azurewebsites.net/api/session/delete" \
                -H "Content-Type: application/json" \
                -d "{\"sessionId\":\"$SESSION_ID\"}" > /dev/null
              echo "✅ Session cleanup completed"
            else
              echo "❌ Session retrieval failed"
              exit 1
            fi
          else
            echo "❌ Session creation failed"
            exit 1
          fi

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [health-check, prepare-deployment]
    if: always()

    steps:
      - name: Deployment Success Notification
        if: needs.health-check.result == 'success'
        run: |
          SERVICES="${{ inputs.services || 'all' }}"
          echo "🎉 Digital Sponsor Function Apps deployment successful!"
          echo "🌍 Environment: ${{ inputs.environment || 'prod' }}"
          echo "📦 Services: $SERVICES"
          echo "🔗 Health: https://health-digitalsponsor-prod.azurewebsites.net/api/health"
          echo "🔐 Auth: https://auth-v2-digitalsponsor-prod.azurewebsites.net/api/auth/validate"
          echo "📝 Session: https://session-digitalsponsor-prod.azurewebsites.net/api/session"
          echo "⏰ Deployed at: $(date -u)"

      - name: Deployment Failure Notification
        if: needs.health-check.result == 'failure'
        run: |
          echo "❌ Digital Sponsor Function Apps deployment failed!"
          echo "🌍 Environment: ${{ inputs.environment || 'prod' }}"
          echo "📦 Services: ${{ inputs.services || 'all' }}"
          echo "⏰ Failed at: $(date -u)"
          echo ""
          echo "Please check the deployment logs and service health status."
          exit 1
