name: Continuous Integration

on:
  push:
    branches: [main, develop, refactor]
  pull_request:
    branches: [main, develop, refactor]

env:
  NODE_VERSION: '20.x'

jobs:
  quality-checks:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Run security audit
        run: npm audit --audit-level moderate

      - name: License compliance check
        run: npm run license-check
        continue-on-error: true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: ['18.x', '20.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [quality-checks, test]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:shared

      - name: Build applications
        run: npm run build

      - name: Validate build artifacts
        run: |
          test -d "apps/web/dist" || (echo "Web build failed" && exit 1)
          test -d "packages/shared/dist" || (echo "Shared package build failed" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web/dist/
            packages/shared/dist/
          retention-days: 7

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # Container Service Validation
  container-validation:
    name: Container Services Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate container services
        run: |
          echo "🔍 Validating container service structure..."

          # Check Auth service structure
          if [ -d "containers/auth-service" ] || [ -f "/tmp/digitalsponsor-auth-app/app.js" ]; then
            echo "✅ Auth service found"
          else
            echo "⚠️ Auth service not found in expected locations"
          fi

          # Check Literature service
          if [ -f "containers/literature-service/app_massive.py" ]; then
            echo "✅ Literature service found"
            python -m py_compile containers/literature-service/app_massive.py
          else
            echo "⚠️ Literature service not found"
          fi

          # Check Chat service
          if [ -f "containers/chat-service/app.py" ]; then
            echo "✅ Chat service found" 
            python -m py_compile containers/chat-service/app.py
          else
            echo "⚠️ Chat service not found"
          fi

          # Check Dockerfiles
          echo "🐳 Validating Dockerfiles..."
          find containers/ -name "Dockerfile*" -type f | while read dockerfile; do
            echo "Validating $dockerfile..."
            # Basic Dockerfile validation
            if grep -q "FROM" "$dockerfile"; then
              echo "✅ $dockerfile has valid FROM statement"
            else
              echo "❌ $dockerfile missing FROM statement"
            fi
          done

      - name: Validate frontend structure
        run: |
          echo "🌐 Validating frontend structure..."

          required_files=(
            "public/index.html"
            "public/admin.html" 
            "public/staticwebapp.config.json"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
              
              # Validate HTML files
              if [[ "$file" == *.html ]]; then
                if grep -q "<!DOCTYPE html>" "$file"; then
                  echo "✅ $file has valid DOCTYPE"
                else
                  echo "⚠️ $file missing DOCTYPE declaration"
                fi
              fi
              
              # Validate JSON files
              if [[ "$file" == *.json ]]; then
                python -m json.tool "$file" > /dev/null && echo "✅ $file is valid JSON" || echo "❌ $file has invalid JSON"
              fi
            else
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
