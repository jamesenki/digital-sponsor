name: Digital Sponsor CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  PYTHON_VERSION: '3.9'

jobs:
  # Security and License Scanning
  security-scan:
    name: Security & License Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Node.js security audit
        run: |
          npm audit --audit-level=high
          cd frontend && npm audit --audit-level=high
          cd ../backend && npm audit --audit-level=high

  # Frontend Testing
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run ESLint
        run: cd frontend && npm run lint

      - name: Run TypeScript check
        run: cd frontend && npm run type-check

      - name: Run unit tests
        run: cd frontend && npm run test:coverage

      - name: Run accessibility tests
        run: cd frontend && npm run test:a11y

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: frontend/coverage/lcov.info
          flags: frontend

  # Backend Testing
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: digital_sponsor_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run ESLint
        run: cd backend && npm run lint

      - name: Run TypeScript check
        run: cd backend && npm run type-check

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/digital_sponsor_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: cd backend && npm run test:coverage

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/digital_sponsor_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: cd backend && npm run test:integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage/lcov.info
          flags: backend

  # AI/ML Testing
  ai-tests:
    name: AI/ML Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install AI dependencies
        run: |
          cd ai
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run flake8 linting
        run: cd ai && flake8 .

      - name: Run black formatting check
        run: cd ai && black --check .

      - name: Run type checking with mypy
        run: cd ai && mypy .

      - name: Run unit tests
        run: cd ai && python -m pytest tests/unit --cov=. --cov-report=xml

      - name: Run RAG accuracy tests
        run: cd ai && python -m pytest tests/rag --verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ai/coverage.xml
          flags: ai

  # AA Traditions Compliance Check
  traditions-compliance:
    name: AA Traditions Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for prohibited content
        run: |
          # Check for potential endorsements
          if grep -r -i "recommend.*treatment\|endorse.*therapy\|suggest.*doctor" --include="*.js" --include="*.ts" --include="*.py" .; then
            echo "❌ Potential Tradition 6 violation: Found endorsement language"
            exit 1
          fi
          
          # Check for AA name misuse
          if grep -r "Alcoholics Anonymous.*sponsor\|AA.*endorse" --include="*.js" --include="*.ts" --include="*.py" .; then
            echo "❌ Potential AA name misuse detected"
            exit 1
          fi
          
          # Check for personal data collection
          if grep -r -i "collect.*email\|store.*name\|track.*identity" --include="*.js" --include="*.ts" --include="*.py" .; then
            echo "❌ Potential Tradition 12 violation: Personal data collection"
            exit 1
          fi
          
          echo "✅ AA Traditions compliance check passed"

      - name: Literature citation validation
        run: |
          # Ensure all literature references include proper citations
          python scripts/validate_citations.py

  # End-to-End Testing
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [frontend-tests, backend-tests, ai-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start application stack
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop application stack
        if: always()
        run: docker-compose -f docker-compose.test.yml down

  # Performance Testing
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [e2e-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start application
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun

      - name: Run load tests
        run: |
          npm install -g k6
          k6 run tests/performance/load-test.js

      - name: Stop application
        if: always()
        run: docker-compose -f docker-compose.test.yml down

  # Build and Package
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [security-scan, frontend-tests, backend-tests, ai-tests, traditions-compliance]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci
          cd ../backend && npm ci
          cd ../ai && pip install -r requirements.txt

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build backend
        run: cd backend && npm run build

      - name: Build Docker images
        run: |
          docker build -t digital-sponsor/frontend:${{ github.sha }} frontend/
          docker build -t digital-sponsor/backend:${{ github.sha }} backend/
          docker build -t digital-sponsor/ai:${{ github.sha }} ai/

      - name: Save Docker images
        run: |
          docker save digital-sponsor/frontend:${{ github.sha }} | gzip > frontend-image.tar.gz
          docker save digital-sponsor/backend:${{ github.sha }} | gzip > backend-image.tar.gz
          docker save digital-sponsor/ai:${{ github.sha }} | gzip > ai-image.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: docker-images
          path: |
            frontend-image.tar.gz
            backend-image.tar.gz
            ai-image.tar.gz
          retention-days: 7

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    needs: [build, e2e-tests]
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: docker-images

      - name: Load Docker images
        run: |
          docker load < frontend-image.tar.gz
          docker load < backend-image.tar.gz
          docker load < ai-image.tar.gz

      - name: Deploy to staging
        run: |
          # Deploy to staging environment
          echo "Deploying to staging..."
          # Add actual deployment commands here

      - name: Run staging smoke tests
        run: |
          # Run basic smoke tests against staging
          curl -f https://staging.digitalsponsor.org/health || exit 1

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build, e2e-tests, performance-tests]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: docker-images

      - name: Load Docker images
        run: |
          docker load < frontend-image.tar.gz
          docker load < backend-image.tar.gz
          docker load < ai-image.tar.gz

      - name: Deploy to production
        run: |
          # Deploy to production environment
          echo "Deploying to production..."
          # Add actual deployment commands here

      - name: Run production health checks
        run: |
          # Run health checks against production
          curl -f https://digitalsponsor.org/health || exit 1

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Production deployment successful"
          # Add notification logic (Slack, email, etc.)

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Production deployment failed, initiating rollback"
          # Add rollback logic